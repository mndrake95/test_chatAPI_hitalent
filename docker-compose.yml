services:

  tests:
    build: .
    container_name: chat_tests
    # Загружаем переменные окружения, специфичные для Docker (используют хост 'db')
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # Run the full test suite with pytest
    command: pytest -q
  db:
    image: postgres:15
    container_name: chat_db_container
    ports:               
      - "5433:5432"
    environment:
      - DB_URL=${DB_URL}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-chat_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: chat_web
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db

