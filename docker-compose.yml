services:
  db:
    image: postgres:15
    container_name: chat_db_container
    ports:               
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chat_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build: .
    container_name: chat_tests
    # Загружаем переменные окружения, специфичные для Docker (используют хост 'db')
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # Запускаем именно pytest
    command: pytest tests/test_models.py -v